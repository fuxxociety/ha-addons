name: ESPHome NetWatch
version: "0.2.2"
slug: esphome_netwatch
description: >-
  Tracks every MAC on the IoT subnet and ranks devices by connectivity trouble
  (ping, ARP, mDNS, HTTP, ESPHome native API with key/password classification).
url: https://github.com/fuxxociety/ha-addons/tree/main/esphome_netwatch
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# host network: ARP and mDNS only work on the real LAN interface
host_network: true
# raw ICMP for ping
privileged:
  - NET_RAW
ingress: true
ingress_port: 8099
watchdog: tcp://[HOST]:[PORT:8099]
panel_icon: mdi:wifi-alert
panel_title: NetWatch
# Supervisor API: finds the ESPHome add-on's ingress port (/addons/<slug>/info). Devices, names and per-device
# credentials then come from the Device Builder's own API, as Home Assistant's ESPHome integration gets them.
hassio_api: true
options:
  # blank = the HA host's own LAN subnet
  subnet: ""
  esphome_addon: 5c53de3b_esphome
  builder_interval: 900
  ping_interval: 30
  sweep_interval: 300
  api_interval: 600
  http_interval: 900
  outage_misses: 3
  retention_days: 14
  log_events: false
  exclude: []
schema:
  subnet: str?
  # slug of the ESPHome Device Builder add-on, as in its page URL (/hassio/addon/<slug>)
  esphome_addon: str?
  # instead of the add-on: a Device Builder URL (local runs)
  esphome_url: str?
  builder_interval: int(120,7200)
  # only for devices the Device Builder does not know
  api_key: password?
  api_password: password?
  web_username: str?
  web_password: password?
  ping_interval: int(10,600)
  sweep_interval: int(60,3600)
  api_interval: int(120,7200)
  http_interval: int(120,7200)
  outage_misses: int(1,20)
  retention_days: int(1,90)
  # write every event to the add-on log too (normally they are only in the UI)
  log_events: bool
  exclude:
    - str
