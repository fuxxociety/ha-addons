name: ESPHome NetWatch
version: "0.1.1"
slug: esphome_netwatch
description: >-
  Tracks every MAC on the IoT subnet and ranks devices by connectivity trouble
  (ping, ARP, mDNS, HTTP, ESPHome native API with key/password classification).
url: https://github.com/fuxxociety/ha-addons/tree/main/esphome_netwatch
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# host network: ARP and mDNS only work on the real LAN interface
host_network: true
# raw ICMP for ping
privileged:
  - NET_RAW
ingress: true
ingress_port: 8099
watchdog: tcp://[HOST]:[PORT:8099]
panel_icon: mdi:wifi-alert
panel_title: NetWatch
map:
  # read-only: secrets.yaml and naming/naming.yaml of the ESPHome config
  - homeassistant_config:ro
options:
  # blank = the HA host's own LAN subnet
  subnet: ""
  secrets_path: /homeassistant/esphome/secrets.yaml
  inventory_path: /homeassistant/esphome/naming/naming.yaml
  secret_api_key: api_enc_key
  secret_api_password: esphome_api_password
  secret_web_username: esphome_web_server_username
  secret_web_password: esphome_web_server_password
  ping_interval: 30
  sweep_interval: 300
  api_interval: 600
  http_interval: 900
  outage_misses: 3
  retention_days: 14
  log_events: false
  exclude: []
schema:
  subnet: str?
  secrets_path: str?
  inventory_path: str?
  secret_api_key: str?
  secret_api_password: str?
  secret_web_username: str?
  secret_web_password: str?
  # explicit values win over secrets.yaml
  api_key: password?
  api_password: password?
  web_username: str?
  web_password: password?
  ping_interval: int(10,600)
  sweep_interval: int(60,3600)
  api_interval: int(120,7200)
  http_interval: int(120,7200)
  outage_misses: int(1,20)
  retention_days: int(1,90)
  # write every event to the add-on log too (normally they are only in the UI)
  log_events: bool
  exclude:
    - str
